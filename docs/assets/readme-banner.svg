<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">SAGE. From Repository to Architecture Definition Document, with Evidence</title>
  <desc id="description">Banner SAGE: logo orb, nama SAGE, judul produk, dan ilustrasi baris kode yang menjadi baris Data Entity Catalog dengan evidence path dan nomor baris.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F7F8"/>
      <stop offset="1" stop-color="#E6FAF6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="23" fill="none" stroke="#DDE5EC" stroke-width="2"/>

  <!-- Logo orb + wordmark -->
  <g transform="translate(64 56) scale(0.48)">
    <circle cx="50" cy="50" r="48" fill="#061E42"/>
    <circle cx="50" cy="50" r="45" fill="none" stroke="#2AC6AE" stroke-width="3"/>
    <circle cx="48" cy="54" r="22" fill="#2AC6AE"/>
    <path d="M36 50 A14 14 0 0 1 50 36 A18 18 0 0 0 40 52 Z" fill="#C9F6F0"/>
    <path d="M71 22 L76 29 L71 36 L66 29 Z" fill="#C9F6F0"/>
    <circle cx="79" cy="44" r="3" fill="#2AC6AE"/>
  </g>
  <text x="124" y="93" fill="#061E42" font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">SAGE<tspan fill="#2AC6AE">.</tspan></text>

  <!-- Headline -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="-1.5" fill="#061E42">
    <text x="64" y="186">From Repository to</text>
    <text x="64" y="238">Architecture Definition Document,</text>
    <text x="64" y="290" fill="#0B7A6C">with Evidence</text>
  </g>

  <!-- Ilustrasi: kode sumber menjadi baris katalog dengan evidence -->
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
    <rect x="852" y="52" width="364" height="124" rx="16" fill="#061E42"/>
    <text x="876" y="84" fill="#7FA3B8" font-size="13">schema.prisma</text>
    <text x="876" y="116" fill="#7FA3B8" font-size="14">182</text>
    <rect x="868" y="124" width="332" height="26" rx="4" fill="#0B3B4F"/>
    <text x="876" y="142" fill="#C9F6F0" font-size="14">183</text>
    <text x="920" y="142" fill="#FFFFFF" font-size="14">model <tspan fill="#2AC6AE">Analysis</tspan> {</text>
    <text x="876" y="166" fill="#7FA3B8" font-size="14">184</text>
    <text x="936" y="166" fill="#7FA3B8" font-size="14">id String @id</text>
  </g>
  <path d="M1034 184v28" stroke="#2AC6AE" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1026 206l8 8 8-8" fill="none" stroke="#2AC6AE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="852" y="222" width="364" height="86" rx="16" fill="#FFFFFF" stroke="#DDE5EC" stroke-width="1.5"/>
  <text x="876" y="252" fill="#5F6F85" font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DATA ENTITY CATALOG</text>
  <text x="876" y="284" fill="#061E42" font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Analysis</text>
  <rect x="1012" y="266" width="188" height="26" rx="8" fill="#E6FAF6" stroke="#2AC6AE" stroke-width="1"/>
  <text x="1106" y="284" text-anchor="middle" fill="#0B7A6C" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13">schema.prisma:183</text>
</svg>
