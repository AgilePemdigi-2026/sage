name: Release images

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set release identity
        id: identity
        shell: bash
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.prefix }}-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sage-release
          cache-to: type=gha,mode=max,scope=sage-release
      - name: Build and publish worker
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.prefix }}-worker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sage-release
          cache-to: type=gha,mode=max,scope=sage-release
      - name: Verify pulled images and production Compose
        env:
          SAGE_WEB_IMAGE: ${{ steps.identity.outputs.prefix }}-web@${{ steps.web.outputs.digest }}
          SAGE_WORKER_IMAGE: ${{ steps.identity.outputs.prefix }}-worker@${{ steps.worker.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export AUTH_BASE_URL=https://sage.example.com
          export GITHUB_APP_CLIENT_ID=release-smoke
          export GITHUB_APP_CLIENT_SECRET=release-smoke-not-a-real-secret
          export GITHUB_APP_SLUG=sage-release-smoke
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$CREDENTIAL_ENCRYPTION_KEY"
          node scripts/check-deployment.mjs
          docker pull "$SAGE_WEB_IMAGE"
          docker pull "$SAGE_WORKER_IMAGE"
          for image in "$SAGE_WEB_IMAGE" "$SAGE_WORKER_IMAGE"; do
            test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          done
          trap 'docker compose -p sage-release-check -f compose.coolify.yaml down -v' EXIT
          docker compose -p sage-release-check -f compose.coolify.yaml up -d --wait --wait-timeout 180
          node scripts/smoke-deployment.mjs --project sage-release-check
          mkdir -p release
          printf 'SAGE_WEB_IMAGE=%s\nSAGE_WORKER_IMAGE=%s\n' "$SAGE_WEB_IMAGE" "$SAGE_WORKER_IMAGE" > release/images.env
          printf '{"commit":"%s","platform":"linux/amd64","web":"%s","worker":"%s","smoke":"passed"}\n' \
            "$GITHUB_SHA" "$SAGE_WEB_IMAGE" "$SAGE_WORKER_IMAGE" > release/manifest.json
          cat release/images.env >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sage-release-${{ github.sha }}
          path: release/
          retention-days: 30
