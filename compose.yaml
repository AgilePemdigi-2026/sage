name: sage

x-common: &common
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-database-environment: &database-environment
  DATABASE_URL: postgresql://sage:${POSTGRES_PASSWORD:?Jalankan npm run setup:local terlebih dahulu}@db:5432/sage

services:
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: sage
      POSTGRES_DB: sage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Jalankan npm run setup:local terlebih dahulu}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage -d sage"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped

  migrate:
    image: sage-worker:local
    pull_policy: never
    environment: *database-environment
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  web:
    <<: *common
    build:
      context: .
      target: web
    image: sage-web:local
    environment:
      <<: *database-environment
      NEXT_TELEMETRY_DISABLED: "1"
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Jalankan npm run setup:local terlebih dahulu}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - storage:/app/storage:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75

  worker:
    <<: *common
    build:
      context: .
      target: worker
    image: sage-worker:local
    environment:
      <<: *database-environment
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      STORAGE_ROOT: /app/storage
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Jalankan npm run setup:local terlebih dahulu}
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "apps/worker/src/health.ts"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    mem_limit: 2g
    cpus: 1.5
    shm_size: 256m

volumes:
  database:
  storage:
